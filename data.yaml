# YOLOv8-Seg dataset configuration for the Deformation project.
# Scope: 1-class binary segmentation.
# 0 = eyewear
#
# 'path' is relative to this YAML file, so the repository can be cloned on
# Windows, Linux, CI, Docker, or another developer machine without changing
# the configuration.

path: ./dataset
train: images/train
val: images/val

nc: 1
names:
  0: eyewear
