services:
  api:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUNTIME_DIR: /app/runtime
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes: [runtime:/app/runtime]
    depends_on: [redis]
    restart: unless-stopped
  worker:
    build: .
    command: celery -A backend.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUNTIME_DIR: /app/runtime
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes: [runtime:/app/runtime]
    depends_on: [redis]
    restart: unless-stopped
  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API: http://localhost:8000
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on: [api]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    expose: ["6379"]
    restart: unless-stopped
volumes:
  runtime:
  dashboard_node_modules:
