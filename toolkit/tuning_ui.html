<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defirmation — Deformation Tuning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 30px; border-radius: 8px; margin-bottom: 30px;
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    .subtitle { font-size: 14px; opacity: 0.9; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h2 { font-size: 18px; margin-bottom: 15px; color: #667eea; }
    .template-list { max-height: 400px; overflow-y: auto; }
    .template-item {
      padding: 12px; margin: 8px 0; background: #f9f9f9;
      border-left: 3px solid #667eea; border-radius: 4px; cursor: pointer;
    }
    .template-item:hover { background: #f0f0f0; }
    .template-item.selected { background: #e8eaf6; border-left-color: #764ba2; font-weight: 600; }
    .template-meta { font-size: 12px; color: #999; margin-top: 4px; }
    button {
      background: #667eea; color: white; border: none; padding: 10px 20px;
      border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #764ba2; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .slider { width: 100%; }
    .label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
    .file-input {
      display: block; padding: 10px; background: #f9f9f9;
      border: 2px dashed #667eea; border-radius: 4px; text-align: center; cursor: pointer;
    }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
    .metric { background: #f9f9f9; padding: 12px; border-radius: 4px; text-align: center; }
    .metric-label { font-size: 12px; color: #999; }
    .metric-value { font-size: 20px; font-weight: 600; color: #667eea; }
    .status { padding: 12px; border-radius: 4px; margin: 12px 0; font-size: 14px; }
    .status.info { background: #e3f2fd; color: #1976d2; }
    .status.success { background: #e8f5e9; color: #388e3c; }
    .status.error { background: #ffebee; color: #d32f2f; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Eyewear VTO — Lens Contour Tuning</h1>
      <p class="subtitle">Calibrate rim_pull_strength per template style</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>1. Select Template</h2>
        <button onclick="batchCreateTemplates()">Create 7 Template Stubs</button>
        <div class="template-list" id="templateList"></div>
      </div>
      <div class="card">
        <h2>2. Upload &amp; Detect</h2>
        <label class="file-input">
          Upload test image
          <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="uploadImage(event)">
        </label>
        <div id="statusArea"></div>
        <button onclick="detectRim()" id="detectBtn" disabled style="width:100%;margin-top:12px">Detect Glasses Rim</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>3. Detection Metrics</h2>
        <div class="metrics">
          <div class="metric"><div class="metric-label">Edge Confidence</div><div class="metric-value" id="edgeConfidence">—</div></div>
          <div class="metric"><div class="metric-label">Fit Error</div><div class="metric-value" id="fitError">—</div></div>
          <div class="metric"><div class="metric-label">Rim Vertices</div><div class="metric-value" id="rimVertices">—</div></div>
          <div class="metric"><div class="metric-label">Proposed Pull</div><div class="metric-value" id="proposedPull">—</div></div>
        </div>
      </div>
      <div class="card">
        <h2>4. Adjust &amp; Confirm</h2>
        <div class="label"><span>Rim Pull Strength</span><span id="pullValue">0.65</span></div>
        <input type="range" min="0" max="100" value="65" class="slider" id="pullSlider" oninput="adjustPull(this.value)">
        <button onclick="confirmCalibration()" id="confirmBtn" disabled style="width:100%;margin-top:20px">Confirm &amp; Save</button>
      </div>
    </div>
  </div>

  <script>
    let selectedTemplate = null;

    async function loadTemplates() {
      const resp = await fetch('/api/templates');
      const data = await resp.json();
      const list = document.getElementById('templateList');
      list.innerHTML = '';
      if (!data.templates.length) {
        list.innerHTML = '<p style="padding:20px;color:#999">No templates. Click Create Stubs.</p>';
        return;
      }
      data.templates.forEach(t => {
        const el = document.createElement('div');
        el.className = 'template-item' + (selectedTemplate === t.name ? ' selected' : '');
        el.onclick = () => selectTemplate(t.name, el);
        el.innerHTML = `<div>${t.name}</div><div class="template-meta">${t.style} · rim_pull=${t.rim_pull_strength.toFixed(2)}</div>`;
        list.appendChild(el);
      });
    }

    async function selectTemplate(name, el) {
      await fetch(`/api/templates/${name}/select`, { method: 'POST' });
      selectedTemplate = name;
      document.querySelectorAll('.template-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('detectBtn').disabled = false;
      showStatus('Selected: ' + name, 'info');
    }

    async function uploadImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      await fetch('/api/calibration/upload-image', { method: 'POST', body: formData });
      showStatus('Uploaded: ' + file.name, 'success');
    }

    async function detectRim() {
      document.getElementById('detectBtn').disabled = true;
      try {
        const resp = await fetch('/api/calibration/detect-rim', { method: 'POST' });
        const data = await resp.json();
        document.getElementById('edgeConfidence').textContent = (data.edge_detection_confidence * 100).toFixed(1) + '%';
        document.getElementById('fitError').textContent = (data.contour_fit_error * 100).toFixed(1) + '%';
        document.getElementById('rimVertices').textContent = data.detected_vertices.length;
        const p = data.proposed_rim_pull_strength;
        document.getElementById('proposedPull').textContent = p.toFixed(2);
        document.getElementById('pullValue').textContent = p.toFixed(2);
        document.getElementById('pullSlider').value = p * 100;
        document.getElementById('confirmBtn').disabled = false;
        showStatus('Detection complete', 'success');
      } catch (e) {
        showStatus('Detection failed: ' + e, 'error');
      } finally {
        document.getElementById('detectBtn').disabled = false;
      }
    }

    function adjustPull(value) {
      document.getElementById('pullValue').textContent = (value / 100).toFixed(2);
    }

    async function confirmCalibration() {
      const strength = document.getElementById('pullSlider').value / 100;
      await fetch(`/api/calibration/adjust-pull-strength?strength=${strength}`, { method: 'POST' });
      const resp = await fetch('/api/calibration/confirm-and-save', { method: 'POST' });
      const data = await resp.json();
      if (data.success) {
        showStatus('Saved rim_pull=' + data.saved_rim_pull_strength.toFixed(3), 'success');
        loadTemplates();
      }
    }

    async function batchCreateTemplates() {
      const resp = await fetch('/api/calibration/batch-templates', { method: 'POST' });
      const data = await resp.json();
      if (data.success) {
        showStatus('Created ' + data.templates_created + ' stubs', 'success');
        loadTemplates();
      }
    }

    function showStatus(msg, type) {
      document.getElementById('statusArea').innerHTML = `<div class="status ${type}">${msg}</div>`;
    }

    loadTemplates();
  </script>
</body>
</html>
