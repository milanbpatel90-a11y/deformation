name: Validate railpack.json

on:
  push:
    paths:
      - "railpack.json"
  pull_request:
    paths:
      - "railpack.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate railpack.json schema
        run: python3 scripts/validate_railpack.py railpack.json
