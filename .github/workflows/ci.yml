name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q backend run.py
      - name: Tests
        run: pytest -q
