name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/video-ingestion-production

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and template assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Python imports
        run: >-
          python -c "from backend.api.main import app; from backend.pipeline.video_pipeline
          import VideoDeformationPipeline; print(app.title, VideoDeformationPipeline.__name__)"

      - name: Run full test suite
        run: python -m pytest -q
