name: CI

on:
  push:
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend scripts run.py
      - name: Python tests
        run: pytest -q
      - name: Dashboard dependencies
        working-directory: dashboard
        run: npm install
      - name: Dashboard build
        working-directory: dashboard
        run: npm run build
