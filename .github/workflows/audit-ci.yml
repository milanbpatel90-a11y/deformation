name: Audit Branch CI

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: ci-only-secret-key-do-not-use-in-production-000000000000
      AUTH_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-not-for-production
      AUTH_DB_PATH: /tmp/deformation-ci-auth.sqlite3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8" \
            "fastapi>=0.110" \
            "uvicorn[standard]>=0.27" \
            "python-multipart>=0.0.9" \
            "pydantic>=2.6" \
            "numpy>=1.26" \
            "scipy>=1.12" \
            "opencv-python-headless>=4.9" \
            "Pillow>=10.2" \
            "trimesh>=4.2" \
            "pygltflib>=1.16" \
            "shapely>=2.0" \
            "python-dotenv>=1.0" \
            "requests>=2.31"

      - name: Compile backend and tests
        run: python -m compileall -q backend tests

      - name: Run test suite
        run: python -m pytest -q
