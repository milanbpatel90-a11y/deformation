name: production-glb-audit

on:
  push:
    branches:
      - chatgpt/glb-production-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/glb-production-audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install repository and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest opencv-python-headless

      - name: Install glTF and Three.js validators
        run: npm install --no-save --package-lock=false gltf-validator@2.0.0-dev.3.10 three@0.162.0

      - name: Run existing deformation tests
        run: pytest -q tests

      - name: Audit actual production GLBs
        run: |
          python scripts/audit_production_glb.py             templates/geometric_metal.glb             templates/rectangle_plastic.glb             --output output/glb_audit_baseline.json

      - name: Run deformation regression on production GLB
        run: python scripts/regress_production_glb.py

      - name: Khronos and Three.js validation
        run: |
          node scripts/validate_exported_glbs.mjs             output/production_regression/identity_135mm.glb             output/production_regression/target_145mm.glb

      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-glb-audit
          path: |
            output/glb_audit_baseline.json
            output/production_regression/regression.json
            output/production_regression/*.glb
            output/production_regression/*.metadata.json
          if-no-files-found: warn
