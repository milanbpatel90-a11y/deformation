<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Dashboard · Defirmation</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101226;color:#eef0fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#252750,transparent 42%),#101226;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid #30334f;background:#15172d}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 14px}.muted{color:#9da3c1;font-size:13px}main{max-width:1180px;margin:28px auto;padding:0 20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,a.button{border:0;border-radius:8px;padding:10px 14px;background:#7887f5;color:#101226;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px}button.secondary,a.secondary{background:#292d4c;color:#eef0fb}button.danger{background:#6b2b43;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.stat,.panel,.product{background:#191c36;border:1px solid #333754;border-radius:12px;padding:16px}.stat strong{display:block;font-size:25px;margin-top:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.product h3{font-size:15px;margin:10px 0 5px}.price{font-size:19px;font-weight:800;color:#8be9fd}.meta{font-size:12px;color:#aab0cd;line-height:1.7}form{display:grid;gap:10px}label{font-size:12px;color:#aeb4d3;display:grid;gap:5px}input,textarea,select{width:100%;background:#101226;color:#fff;border:1px solid #3a3e60;border-radius:7px;padding:10px;font:inherit;font-size:13px}textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{padding:8px 10px}.message{padding:10px;border-radius:8px;background:#252a49;color:#c6d1ff;font-size:13px;white-space:pre-wrap}.hidden{display:none!important}.tag{font-size:10px;border-radius:20px;background:#293252;padding:4px 8px;color:#b9c5ff}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){header{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1 id="heading">My Product Dashboard</h1><div class="muted" id="subheading">Your private eyewear catalogue</div></div><div class="toolbar" style="margin:0"><a class="button secondary" href="/viewer/">Generate 3D Model</a><button class="secondary" id="logout">Sign out</button></div></header>
<main><div class="stats"><div class="stat"><span class="muted">Products</span><strong id="count">—</strong></div><div class="stat"><span class="muted">Active products</span><strong id="active">—</strong></div><div class="stat"><span class="muted">Access</span><strong id="access">Private</strong></div></div>
<div class="toolbar"><div><h2 id="list-title" style="margin:0">My Products</h2><div class="muted" id="list-help">Only you can view and manage these products.</div></div><span style="flex:1"></span><button id="new-product">+ Add product</button></div>
<div class="layout"><section><div class="products" id="products"></div><div class="message hidden" id="empty">No products saved yet. Generate a GLB, then select “Add to dashboard”.</div></section>
<aside class="panel hidden" id="form-panel"><h2 id="form-title">Add product</h2><form id="product-form"><input type="hidden" id="product-id"><input type="hidden" id="glb-filename">
<label>Item name *<input id="item_name" required maxlength="160" placeholder="Classic Aviator 01"></label>
<div class="two"><label>Price<input id="price" type="number" min="0" step="0.01"></label><label>Currency<select id="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option></select></label></div>
<label>Description<textarea id="description" maxlength="5000"></textarea></label>
<div class="two"><label>Weight (grams)<input id="weight_grams" type="number" min="0" step="0.1"></label><label>Size / dimensions<input id="size" placeholder="58-14-140 mm"></label></div>
<div class="two"><label>Model / SKU<input id="model"></label><label>Style<input id="style" placeholder="Aviator, Round, Wayfarer"></label></div>
<div class="two"><label>Colour<input id="colour"></label><label>Brand<input id="brand"></label></div>
<div class="two"><label>Frame material<input id="frame_material"></label><label>Logo URL<input id="logo_url" type="url" placeholder="https://..."></label></div>
<label>Status<select id="status"><option value="draft">Draft</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
<div class="toolbar"><button id="save" type="submit">Save product</button><button class="secondary" type="button" id="cancel">Cancel</button></div><div class="message hidden" id="form-message"></div></form></aside></div><div class="message hidden" id="page-message" style="margin-top:16px"></div></main>
<script>
const $=id=>document.getElementById(id);let currentUser=null,products=[];
function csrf(){return document.cookie.split('; ').find(x=>x.startsWith('defirmation_csrf='))?.split('=').slice(1).join('=')||''}
async function api(url,options={}){const headers={...(options.headers||{})};if(!['GET','HEAD'].includes((options.method||'GET').toUpperCase()))headers['X-CSRF-Token']=csrf();const r=await fetch(url,{credentials:'same-origin',...options,headers});if(r.status===204)return null;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed ('+r.status+')');return d}
function msg(el,s){el.textContent=s;el.classList.remove('hidden')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showForm(p=null,glb=''){$('form-panel').classList.remove('hidden');$('form-title').textContent=p?'Edit product':'Add product';$('product-id').value=p?.id||'';$('glb-filename').value=glb||'';for(const k of ['item_name','price','currency','description','weight_grams','size','model','style','colour','brand','frame_material','logo_url','status'])$(k).value=p?.[k]??(k==='currency'?'INR':k==='status'?'draft':'');$('form-message').classList.add('hidden');$('form-panel').scrollIntoView({behavior:'smooth'})}
function render(){$('count').textContent=products.length;$('active').textContent=products.filter(p=>p.status==='active').length;$('access').textContent=currentUser.role==='owner'?'Admin':'Private';$('products').replaceChildren();$('empty').classList.toggle('hidden',products.length>0);
for(const p of products){const c=document.createElement('article');c.className='product';const price=p.price==null?'Price not set':esc(p.currency||'INR')+' '+Number(p.price).toLocaleString();c.innerHTML='<span class="tag">'+esc(p.status)+'</span><h3>'+esc(p.item_name)+'</h3><div class="price">'+price+'</div><div class="meta">'+esc(p.brand||'No brand')+' · '+esc(p.style||'Style not set')+'<br>'+esc(p.colour||'Colour not set')+' · '+(p.weight_grams==null?'Weight not set':esc(p.weight_grams)+' g')+'<br>'+esc(p.size||'Size not set')+'</div>'+(currentUser.role==='owner'?'<div class="meta">Owner: '+esc(p.owner_email||p.user_id)+'</div>':'')+'<div class="actions"><button class="secondary" data-edit="'+p.id+'">Edit</button><button class="danger" data-delete="'+p.id+'">Delete</button>'+(currentUser.role==='owner'?'<button class="secondary" data-download="'+p.id+'">Download GLB</button>':'')+'<button class="secondary" data-view="'+p.id+'">View GLB</button></div>';$('products').appendChild(c)}
$('products').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(products.find(p=>p.id===b.dataset.edit)));
$('products').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product and its stored GLB?'))return;try{await api('/api/products/'+b.dataset.delete,{method:'DELETE'});await load()}catch(e){msg($('page-message'),e.message)}});
$('products').querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>location.href='/api/products/'+b.dataset.download+'/download');
$('products').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.href='/viewer/?glb='+encodeURIComponent('/api/products/'+b.dataset.view+'/model'))}
async function load(){const d=await api('/api/products');products=d.products||[];render()}
$('new-product').onclick=()=>showForm();$('cancel').onclick=()=>$('form-panel').classList.add('hidden');
$('product-form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const data={};for(const k of ['item_name','currency','description','size','model','style','colour','brand','frame_material','logo_url','status'])data[k]=$(k).value||null;for(const k of ['price','weight_grams'])data[k]=$(k).value===''?null:Number($(k).value);try{const id=$('product-id').value,glb=$('glb-filename').value;if(id)await api('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});else{if(!glb)throw new Error('No generated GLB selected. Generate a model, then use Add to dashboard.');data.glb_filename=glb;await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}$('form-panel').classList.add('hidden');await load();msg($('page-message'),'Product saved successfully.')}catch(err){msg($('form-message'),err.message)}finally{$('save').disabled=false}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});location.href='/login?signed_out=1'}catch(e){msg($('page-message'),e.message)}};
(async()=>{try{const me=await api('/api/auth/me');currentUser=me.user;if(currentUser.role==='owner'){$('heading').textContent='Admin Product Dashboard';$('subheading').textContent='All users · All saved eyewear products';$('list-title').textContent='All users’ products';$('list-help').textContent='Administrator access across every user account.'}const glb=new URLSearchParams(location.search).get('save_glb');if(glb)showForm(null,glb);await load()}catch(e){if(e.message.toLowerCase().includes('sign-in'))location.href='/login';else msg($('page-message'),e.message)}})();
</script></body></html>
